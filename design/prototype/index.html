<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kickarse UI prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Kickarse — high-fidelity interactive prototype (Phase 1).
  The plugin surface is ONE <canvas> drawn with Canvas 2D calls that map 1:1 to NanoVG:
    beginPath/moveTo/lineTo/bezierCurveTo/quadraticCurveTo/arc/rect  -> nvgBeginPath/MoveTo/LineTo/BezierTo/QuadTo/Arc/Rect
    fill/stroke with colours, createLinearGradient/createRadialGradient -> nvgLinearGradient/nvgRadialGradient
    boxGradient()   (below) reproduces nvgBoxGradient exactly: linear ramp over `feather` across a rounded-rect edge
    drawImage       -> nvgImagePattern on a rect
    fillText        -> nvgText (fonts are the same static TTFs the plugin embeds)
  No CSS styling, filters, shadows or blend modes touch the plugin surface.
  Layout numbers here ARE the spec: docs/design/DESIGN.md quotes them.
  URL params:  ?scale=1..2   ?shot=<name> (deterministic states for screenshots)   ?freeze=<phase>   ?test=1 (interaction self-test)
-->
<style>
  html, body { margin: 0; background: #2B2B2C; color: #aaa; font: 12px/1.4 system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #wrap { position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  canvas { display: block; outline: none; }
  #dev { margin-top: 14px; display: flex; gap: 14px; align-items: center; opacity: .65; }
  #dev button, #dev select { background: #3a3a3b; color: #ddd; border: 1px solid #4a4a4b; border-radius: 3px; padding: 3px 8px; font: inherit; }
  body.shot #dev { display: none; }
  body.shot { justify-content: flex-start; align-items: flex-start; }
  body.shot #wrap { box-shadow: none; }
</style>
<script src="assets/embedded.js"></script>
</head>
<body>
<div id="wrap"><canvas id="ui" tabindex="0"></canvas></div>
<div id="dev">

  <label>UI scale <select id="devScale"><option>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select></label>

let frameDt = 1/60, lastT = performance.now();

  S.trigFlash = Math.max(0, S.trigFlash - frameDt*5); S.midiFlash = Math.max(0, S.midiFlash - frameDt*5);
  S.savedFlash = Math.max(0, S.savedFlash - frameDt*0.8); S.capturedFlash = Math.max(0, S.capturedFlash - frameDt*0.35);

}
function draw() {
